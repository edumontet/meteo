<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Métro">
<title>Métro Rennes</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="metro.css">
</head>
<body>
<main class="app">
  <header class="top">
    <a class="back" href="../">‹ Météo</a>
    <h1>
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="14" rx="3"/><path d="M5 11h14M9 21l-2 0M15 21h2M8 17l-2 4M16 17l2 4"/><circle cx="9" cy="14" r=".6" fill="currentColor"/><circle cx="15" cy="14" r=".6" fill="currentColor"/></svg>
      Métro Rennes
    </h1>
  </header>

  <section class="card">
    <div class="lbl">Ligne</div>
    <div class="seg" role="group" aria-label="Ligne">
      <button type="button" id="btn-a" data-line="A">Ligne A</button>
      <button type="button" id="btn-b" data-line="B">Ligne B</button>
    </div>

    <label class="lbl" for="station">Station</label>
    <select id="station"></select>

    <label class="lbl" for="direction">Direction</label>
    <select id="direction"></select>
  </section>

  <section class="result" id="result" aria-live="polite">
    <div class="r-label" id="r-label">Prochain métro dans</div>
    <div class="r-main" id="r-main">…</div>
    <div class="r-next" id="r-next"></div>
    <div class="r-note" id="r-note"></div>
  </section>

  <button type="button" class="status" id="status" aria-label="Actualiser">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
    <span id="status-text">Chargement…</span>
  </button>

  <pre class="debug" id="debug" hidden></pre>

  <footer class="foot">Données temps réel : STAR / Rennes Métropole (data.explore.star.fr), licence ODbL.</footer>
</main>
<script src="metro.js"></script>
</body>
</html>
