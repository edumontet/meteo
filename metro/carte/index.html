<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1220">
<title>Rennes en direct</title>
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="carte.css?v=8">
</head>
<body>
<div id="map"></div>

<aside class="panel">
  <div class="p-title">
    <span class="live" aria-hidden="true"></span>
    Rennes en direct
  </div>
  <div class="p-counts">
    <span><b id="n-bus">–</b> bus</span>
    <span><b id="n-metro">–</b> métros</span>
  </div>
  <div class="p-status" id="status">Chargement…</div>
  <div class="p-note">Bus : position GPS du STAR, publiée environ toutes les minutes ; les bus roulent en continu d'une position à la suivante. Métro : position estimée d'après les horaires de passage en station.</div>
  <a class="p-back" href="../">‹ Prochains passages</a>
</aside>

<button type="button" class="locate" id="locate" hidden aria-label="Centrer sur ma position">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg>
</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="carte.js?v=8"></script>
</body>
</html>
